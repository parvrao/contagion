/* Layout concept: a fixed stage (live fluid + exploded glass device) with a quiet text rail on the left.
   Page scroll only drives the sequence. Dark-first, bone-white second. One signal colour, one calm colour. */
:root{
  color-scheme:light;
  --bg:#E6E4DF; --fg:#131415; --fg2:#3B3B39; --dim:#6B6A67; --faint:#A5A39D;
  --line:rgba(19,20,21,.16);
  --signal:#E42D08; --signal-hot:#FF9F73; --calm:#1C7F6B; --calm-hot:#8CDAC6;
  --btn-hi:#F4F3EF; --btn-lo:#D9D7D1; --btn-edge:rgba(255,255,255,.95); --btn-shadow:rgba(70,62,48,.38);
  --veil:rgba(230,228,223,.9); --veil-0:rgba(230,228,223,0);
  --sans:"Geist",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --dot:"Doto",ui-monospace,Menlo,monospace;
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0C0D0F; --fg:#ECEBE7; --fg2:#B4B3AE; --dim:#8E8F92; --faint:#55575B;
  --line:rgba(236,235,231,.14);
  --signal:#FF4A24; --signal-hot:#FFB496; --calm:#2FA58C; --calm-hot:#D3F4EA;
  --btn-hi:#25272B; --btn-lo:#16171A; --btn-edge:rgba(255,255,255,.10); --btn-shadow:rgba(0,0,0,.65);
  --veil:rgba(12,13,15,.9); --veil-0:rgba(12,13,15,0);
}
html{scroll-snap-type:y proximity}
body{background:var(--bg);color:var(--fg);font:400 15px/1.55 var(--sans);overflow-x:hidden;-webkit-font-smoothing:antialiased}
#track>section{height:100vh;height:100svh;scroll-snap-align:start}
#fluid,#gl{position:fixed;inset:0;width:100%;height:100%;display:block}
#gl{touch-action:pan-y;cursor:grab}
#gl:active{cursor:grabbing}
.veil{position:fixed;inset:0;pointer-events:none;background:linear-gradient(90deg,var(--veil) 0%,var(--veil) 14%,var(--veil-0) 58%)}
.hud{position:fixed;inset:0;pointer-events:none;--gut:clamp(16px,4.2vw,68px)}
.hud button,.hud .ctl,.hud .rowc{pointer-events:auto}
button{font:inherit;color:inherit}

.mark{font:800 15px/1 var(--dot);letter-spacing:.14em}
.topr{display:flex;align-items:center;gap:14px;font:400 11px/1 var(--mono);color:var(--dim)}

.copy{position:absolute;left:var(--gut);top:clamp(72px,13vh,130px);bottom:clamp(76px,12vh,120px);width:min(35rem,43vw);display:flex;flex-direction:column;justify-content:space-between;gap:18px;min-height:0}
.copy>*{flex-shrink:0}
.copy>.term{flex-shrink:1}
@media (max-height:860px){#num{font-size:clamp(48px,9vh,84px)!important}}
.sw{transition:opacity .22s ease,transform .22s ease}
.copy.out .sw{opacity:0;transform:translateY(6px)}
.num{font:800 clamp(3.2rem,8vw,7rem)/.9 var(--dot);letter-spacing:.02em;color:var(--fg);display:flex;align-items:baseline;gap:.5rem}
.num small{font:400 11px/1 var(--mono);color:var(--dim);letter-spacing:.04em}
h1{font:300 clamp(1.7rem,3.3vw,2.9rem)/1.08 var(--sans);letter-spacing:-.025em;margin:.9rem 0 .8rem;text-wrap:balance;max-width:20ch}
.lede{color:var(--fg2);max-width:46ch;margin:0;font-size:.97rem;text-wrap:pretty}
.plain{margin:.85rem 0 0;padding-left:.85rem;border-left:2px solid var(--signal);max-width:46ch;font-size:.86rem;line-height:1.5;color:var(--fg)}
.plain b{font-weight:600}
.foot{font:400 11px/1.5 var(--mono);color:var(--dim);margin:.7rem 0 0}
.ctl{display:flex;flex-wrap:wrap;gap:10px;margin-top:1.15rem;align-items:center}
.rowc{display:flex;flex-direction:column;gap:8px;margin-top:1.1rem;width:100%}
.dr{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--line);font-size:.86rem}

  background:linear-gradient(180deg,var(--btn-hi),var(--btn-lo));

.soft[aria-pressed="true"] .led{background:var(--signal);box-shadow:0 0 8px var(--signal)}

.dock{position:absolute;right:var(--gut);bottom:calc(clamp(14px,3vh,30px) + env(safe-area-inset-bottom,0px));display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}

.copy[hidden],.sheet[hidden]{display:none!important}
.hud a.soft{pointer-events:auto;text-decoration:none;color:inherit}
.live .led{background:var(--calm);box-shadow:0 0 8px var(--calm)}

.story{display:flex;gap:8px;pointer-events:auto}
.sheet{position:absolute;left:var(--gut);top:clamp(72px,13vh,130px);bottom:clamp(76px,12vh,120px);width:min(35rem,43vw);overflow:auto;pointer-events:auto;padding-right:6px;scrollbar-width:thin}
.sheet h2{font:300 clamp(1.7rem,3.4vw,2.5rem)/1.08 var(--sans);letter-spacing:-.02em;margin:0 0 .7rem;text-wrap:balance}
.sheet .lede{margin:0 0 1rem}
.sheet dl{margin:0;display:grid;gap:.85rem}
.sheet dt{font:600 .86rem/1.3 var(--sans);color:var(--fg);margin:0}

.t3.l.hot{color:var(--fg);opacity:1}
.t3.l{text-align:right}
.t3{position:fixed;left:0;top:0;font:500 10.5px/1 var(--mono);color:var(--fg2);white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .35s;will-change:transform}
.t3.on{opacity:1}
.t3.l{color:var(--faint)}
.t3.c::before{content:"";display:inline-block;width:18px;height:1px;background:var(--signal);vertical-align:middle;margin-right:7px}

.nofluid{background:radial-gradient(60% 50% at 70% 60%,rgba(255,74,36,.12),transparent 70%),var(--bg)}

@media (max-width:1180px){.topr .tag{display:none}}
@media (max-width:760px){
  .story{position:absolute;left:0;right:0;top:44px;justify-content:flex-start;flex-wrap:wrap}
  .sheet{top:auto;bottom:calc(76px + env(safe-area-inset-bottom,0px));width:auto;right:var(--gut);max-height:58vh}
  .veil{background:linear-gradient(0deg,var(--veil) 0%,var(--veil) 46%,var(--veil-0) 74%)}
  .copy{top:auto;bottom:calc(76px + env(safe-area-inset-bottom,0px));width:auto;right:var(--gut);display:block}
  .num{font-size:2.3rem;margin-bottom:-.2rem}
  h1{font-size:1.5rem;margin:.5rem 0}
  .lede{font-size:.88rem}
  .term,.note,.dots{display:none}
  .ctl{margin-top:.8rem;gap:8px}
  .read{margin-top:.8rem;gap:4px 22px}
  .rv{font-size:1.5rem}
  .dock{left:var(--gut);justify-content:flex-start}
  .topr .tag{display:none}
}
@media (prefers-reduced-motion:reduce){.sw{transition:none}.tl.live::after{animation:none}}

  var d=SHEETS[m];cp.hidden=true;sh.hidden=false;sh.scrollTop=0;
  sh.innerHTML="<h2>"+d.h+"</h2><p class='lede'>"+d.lede+"</p><dl>"+d.items.map(function(x){return"<div><dt>"+x[0]+"</dt><dd>"+x[1]+"</dd></div>"}).join("")+"</dl><p class='end'>"+d.end+"</p>";
}
[].forEach.call(document.querySelectorAll(".story .soft"),function(b){b.addEventListener("click",function(){setMode(b.dataset.mode)})});
["#next","#back","#explode","#xray"].forEach(function(id){var b=$(id);if(b)b.addEventListener("click",function(){if(mode!=="works")setMode("works")})});
$("#theme").addEventListener("click",function(){var d=T.dark;document.documentElement.setAttribute("data-theme",d?"light":"dark");T.key="";readTheme()});
addEventListener("keydown",function(e){
  if(e.target&&/INPUT|TEXTAREA/.test(e.target.tagName))return;
  if(e.key==="ArrowRight"||e.key==="PageDown"){e.preventDefault();go(cur+1)}
  else if(e.key==="ArrowLeft"||e.key==="PageUp"){e.preventDefault();go(cur-1)}
});
matchMedia("(prefers-color-scheme: dark)").addEventListener&&matchMedia("(prefers-color-scheme: dark)").addEventListener("change",function(){T.key="";readTheme()});
addEventListener("resize",resize);

if(THREE_OK){try{buildScene()}catch(e){console.warn(e);THREE_OK=false}}
resize();
setStep(0);
var last=performance.now(),t=0,sS=0,fc=0;
function frame(now){
  var dt=Math.min(.05,(now-last)/1000);last=now;t+=dt;fc++;
  if(fc%20===0)readTheme();
  var target=Math.max(0,Math.min(N-1,scrollY/Math.max(1,innerHeight)));
  sS+=(target-sS)*Math.min(1,dt*6);
  var idx=Math.round(sS);if(idx!==cur)setStep(idx);
  if(THREE_OK){updateDevice(dt,t,sS);updateParticles(dt,t);updateTags();renderer.render(scene,camera)}
  emitters(dt);if(fluid)fluid.frame(dt);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
